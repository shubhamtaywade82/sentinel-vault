default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    database: sentinel_vault_development
  # Solid Queue's own database, as in production, so bin/jobs runs locally.
  queue:
    <<: *default
    database: sentinel_vault_development_queue
    migrations_paths: db/queue_migrate
    # Solid Queue ships a Ruby schema; only the primary needs structure.sql.
    schema_format: ruby

test:
  <<: *default
  database: sentinel_vault_test

# Production reads connection strings from the environment; nothing is defaulted.
production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *primary_production
    url: <%= ENV["CACHE_DATABASE_URL"] %>
    migrations_paths: db/cache_migrate
    schema_format: ruby
  queue:
    <<: *primary_production
    url: <%= ENV["QUEUE_DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
    schema_format: ruby
